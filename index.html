<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f2f2;
    }

    .login-container {
        width: 100%;
        max-width: 400px;
        padding: 35px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    .campo {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
    }

    input:focus {
        border-color: #000;
    }

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 6px;
        background: #000;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #333;
    }

    button:disabled {
        background: #999;
        cursor: not-allowed;
    }

    #mensagem {
        margin-top: 18px;
        text-align: center;
        font-weight: bold;
    }

    .sucesso {
        color: #087a20;
    }

    .erro {
        color: #d00000;
    }
</style>

</head> <body>
<div class="login-container">

    <h1>Login</h1>

    <form id="formLogin">

        <div class="campo">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                required
            >

        </div>

        <div class="campo">

            <label for="password">
                Senha
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >

        </div>

        <button
            type="submit"
            id="btnLogin"
        >
            Entrar
        </button>

    </form>

    <div id="mensagem"></div>

</div>


<script>

    const formLogin = document.getElementById("formLogin");

    const email = document.getElementById("email");

    const password = document.getElementById("password");

    const btnLogin = document.getElementById("btnLogin");

    const mensagem = document.getElementById("mensagem");


    formLogin.addEventListener("submit", async function (event) {

        event.preventDefault();


        mensagem.textContent = "";
        mensagem.className = "";


        const emailValue = email.value.trim();

        const passwordValue = password.value;


        if (!emailValue || !passwordValue) {

            mensagem.textContent =
                "Preencha todos os campos.";

            mensagem.className = "erro";

            return;
        }


        btnLogin.disabled = true;

        btnLogin.textContent = "Entrando...";


        try {

            const response = await fetch(
                "http://localhost:3000/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    /*
                     * Permite que o navegador
                     * envie e receba cookies.
                     */
                    credentials: "include",

                    body: JSON.stringify({
                        email: emailValue,
                        password: passwordValue
                    })
                }
            );


            let data = {};


            try {

                data = await response.json();

            } catch {

                data = {};

            }


            /*
             * LOGIN REALIZADO
             */

            if (response.ok) {

                mensagem.textContent =
                    data.message ||
                    "Login realizado com sucesso!";

                mensagem.className = "sucesso";


                /*
                 * IMPORTANTE:
                 *
                 * O JavaScript NÃO salva o token.
                 *
                 * Se o backend responder:
                 *
                 * Set-Cookie: token=...;
                 * HttpOnly;
                 * Secure;
                 * SameSite=...
                 *
                 * o navegador armazenará
                 * o cookie automaticamente.
                 */


                console.log(
                    "Login realizado:",
                    data
                );


                /*
                 * Se quiser redirecionar depois
                 * do login, descomente:
                 *
                 * window.location.href = "inicio.html";
                 */

            }


            /*
             * ERRO NO LOGIN
             */

            else {

                mensagem.textContent =
                    data.message ||
                    data.error ||
                    "E-mail ou senha inválidos.";

                mensagem.className = "erro";

            }

        }


        /*
         * ERRO DE CONEXÃO
         */

        catch (error) {

            console.error(
                "Erro ao conectar com a API:",
                error
            );

            mensagem.textContent =
                "Não foi possível conectar com o servidor.";

            mensagem.className = "erro";

        }


        finally {

            btnLogin.disabled = false;

            btnLogin.textContent = "Entrar";

        }

    });

</script>

</body> </html>
